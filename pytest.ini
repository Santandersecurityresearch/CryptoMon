[pytest]
testpaths = tests

# Put the repository root on sys.path so `import cryptomon` resolves without
# the package being installed. `python -m pytest` adds the working directory
# automatically and the `pytest` console script does not, so without this the
# suite passes locally and fails in CI -- which is exactly what happened.
pythonpath = .

addopts = --strict-markers
markers =
    smoke: fast checks needing no capture fixtures -- the merge gate.
           Run with `pytest -m smoke`; finishes in under a second and covers
           importability without bcc, code point handling and storage
           dispatch. The unmarked tests additionally diff the parsers against
           tshark over real captures.
