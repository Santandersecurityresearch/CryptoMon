name: tests

# The runners have no bcc, no pyroute2, no MongoDB and no root -- which is
# exactly the acceptance criterion for this suite. If the package ever goes
# back to importing bcc at module scope, everything here stops collecting.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: merge gate (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: byte-compile everything
        run: python -m compileall -q cryptomon pcapscan fapi api.py cryptomon.py
      - name: selected checks against the change
        # No capture fixtures, no tshark: importability without bcc, code
        # point and GREASE handling, storage dispatch and write accounting.
        run: pytest -m smoke -q

  full:
    name: full suite
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the parsers use a match statement.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: parsers vs the tshark oracle, over committed captures
        run: pytest -q

  fuzz:
    name: fuzz the parsers
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: mutate the corpus and run every parser over it
        # Every byte this project reads is chosen by somebody else -- the
        # wire, a capture file, and shortly a browser upload. The budget is
        # wall-clock rather than a case count so that a slower runner does
        # less work instead of failing, and the seed is fixed so a failure
        # here is reproducible with the same command locally.
        run: ./tests/tools/fuzz.py --seconds 60 --seed ci

  oracle:
    name: the tshark oracle has not drifted
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install tshark
        # Non-interactive, because the package asks whether non-root users
        # may capture and will otherwise wait for an answer nobody can give.
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
          tshark -v | head -1
      - name: regenerate it and check nothing moved
        # The committed oracle is what the suite is judged against, so it has
        # to be what tshark actually says -- not what tshark said on
        # somebody's laptop once. Code points are canonicalised to hex first:
        # Wireshark 3.4 prints ciphersuites in decimal and 4.2 in hex, and
        # without that this job would test Wireshark's release notes.
        run: |
          ./tests/tools/make_stream_oracle.sh
          git diff --exit-code -- tests/oracle/streams \
            || { echo "::error::the committed oracle no longer matches tshark"; exit 1; }

  bpf:
    name: eBPF compiles and verifies
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build the check environment
        # In a container, not on the runner directly. bcc compiles against
        # the kernel headers it is given, and Ubuntu's python3-bpfcc cannot
        # parse the headers of the kernel a runner boots -- it fails inside
        # include/linux/bpf.h, on struct bpf_wq and BPF_LOAD_ACQ, before
        # reaching our program at all. Pinning the environment leaves the C
        # as the only thing under test.
        run: docker build -t cryptomon-bpf tests/tools/bpf-image
      - name: compile the program and run it past the verifier
        # The only part of this project that runs in the kernel, and the only
        # part the pytest suite cannot reach. A mistake here does not produce
        # a wrong answer -- it produces a service that will not start, which
        # is what issue #26 is.
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work \
            cryptomon-bpf python3 tests/tools/check_bpf.py
      - name: attach it to loopback and replay the framing fixtures
        # Compiling is not behaving. This attaches the program for real and
        # checks which framings reach userspace.
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work \
            cryptomon-bpf python3 tests/tools/check_bpf_behaviour.py

  images:
    name: the container images build and run
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: the offline analyser reads a capture
        # The image most people will use, and the only one that needs
        # nothing from the host: no root, no bcc, no database, no network.
        # Asserting on the certificate section rather than on the exit code,
        # because the one third-party package in the image is what produces
        # it and a silently empty certificate inventory is the failure worth
        # catching.
        run: |
          docker build -f docker/Dockerfile.offline -t cryptomon-offline .
          docker run --rm --network none --read-only \
            -v "$PWD/tests/fixtures/streams:/captures:ro" \
            cryptomon-offline /captures/tls12_certificate.pcap | tee /tmp/report
          grep -q 'Certificate keys' /tmp/report
          grep -q 'RSA-2048' /tmp/report

      - name: the api image starts and serves
        # Against a throwaway MongoDB, because the point is that the image
        # starts and answers -- not that the query layer works, which the
        # pytest suite covers without a container.
        run: |
          docker build -f docker/Dockerfile.api -t cryptomon-api .
          docker network create cryptomon-ci
          docker run -d --name mongo --network cryptomon-ci mongo:7.0
          docker run -d --name api --network cryptomon-ci \
            -p 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:size=64m --cap-drop ALL \
            -e DB_URL=mongodb://mongo:27017 -e DB_NAME=cryptomon \
            cryptomon-api
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/docs >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/docs >/dev/null
          curl -fsS http://127.0.0.1:8000/data/count
          docker rm -f api mongo

      - name: the sensor image loads the program it ships
        # The bpf job above checks the C in a purpose-built test image.
        # This checks it in the image an operator will actually run, with
        # the capabilities docker/README.md tells them to grant and no
        # more -- so a change to the sensor image that breaks bcc, the
        # kernel headers or the entrypoint's BCC_KERNEL_SOURCE fallback
        # fails here rather than in somebody's deployment.
        run: |
          docker build -f docker/Dockerfile.sensor -t cryptomon-sensor .
          docker run --rm --cap-add BPF cryptomon-sensor
          docker run --rm --cap-drop ALL \
            --cap-add BPF --cap-add PERFMON --cap-add NET_RAW \
            -v "$PWD":/work -w /work cryptomon-sensor \
            python3 tests/tools/check_bpf_behaviour.py
