# Response headers for CryptoMon, and the reasoning for each one.
#
# Included rather than written once at server level because of an nginx rule
# that bites everybody eventually: `add_header` does not accumulate across
# nesting levels. The moment a `location` adds a single header of its own,
# *every* inherited `add_header` from the enclosing `server` block stops
# being applied there. A deployment that sets HSTS at server level and
# `Cache-Control` inside `location /analyse/` therefore serves the report
# page -- the one page holding other people's browsing history -- with no
# security headers at all, and nothing anywhere reports an error.
#
# So this file is included in each block that needs it, next to whatever
# that block adds. See cryptomon.conf.
#
# This is a short list on purpose. Every header here is here because of
# something this application actually does; see below for the popular ones
# that are deliberately absent.

# The only header that survives the user typing "http://" next time. Without
# it, the very first request of every session is plaintext and redirected,
# and that request carries the session's Host and path -- and on this service
# a path can be a report id. Two years, subdomains included.
#
# `preload` is NOT set. Preloading is a one-way door enforced by browser
# vendors and is a decision for whoever owns the domain, not for a config
# file shipped in a repository.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# /analyse/reports/<id>/json returns JSON assembled from a capture somebody
# else uploaded: SNI strings, ALPN names, certificate subjects. Those are
# attacker-chosen bytes in a response body. `nosniff` is what stops a browser
# deciding that an `application/json` body which happens to start with markup
# is really HTML and running it in this origin.
add_header X-Content-Type-Options "nosniff" always;

# A report URL is a capability: 32 hex characters that are the only thing
# standing between a stranger and a record of which hosts a machine talked
# to. `no-referrer` keeps that id out of the Referer header of any request
# the report page ever makes -- today it makes none, but the page gains
# content as the dashboard lands and a referrer leak is silent when it
# happens.
add_header Referrer-Policy "no-referrer" always;

# Clickjacking, for an app whose one interactive control is a file picker.
# Framing this page and steering a drag onto the input is the classic way to
# make somebody upload a file they did not mean to upload. `frame-ancestors`
# in the CSP below says the same thing; X-Frame-Options is kept for browsers
# that predate CSP level 2 and costs one line.
add_header X-Frame-Options "DENY" always;

# Content-Security-Policy, fitted to what this application serves rather
# than copied.
#
#   default-src 'none'      Nothing is allowed that is not named below.
#   script-src 'self'       There is no script today. The dashboard's charts
#                           will be vendored into this origin (see the
#                           comment at the top of fapi/app/templates/
#                           base.html), never loaded from a CDN, so 'self'
#                           is the whole allowance. If you ever find
#                           yourself adding a CDN host here, the vendoring
#                           decision has been reversed and that is the thing
#                           to argue about, not this line.
#   style-src 'self' 'unsafe-inline'
#                           base.html carries its stylesheet in an inline
#                           <style> block. 'unsafe-inline' is the price of
#                           that and it is a real weakening: it means an
#                           injected <style> would be honoured. The fix is
#                           to serve the stylesheet as a file and drop
#                           'unsafe-inline' here; until somebody does that,
#                           saying so is better than pretending.
#   img-src 'self' data:    data: covers inline SVG/PNG in a rendered chart.
#   connect-src 'self'      The dashboard's fragment routes are same-origin
#                           fetches.
#   form-action 'self'      The upload form posts to itself. This stops an
#                           injected <form action="https://elsewhere"> from
#                           collecting a capture.
#   frame-ancestors 'none'  As X-Frame-Options, for browsers that honour it.
#   base-uri 'none'         An injected <base> would otherwise silently
#                           re-point every relative URL on the page, which
#                           on a subpath deployment is the same bug class
#                           this whole config exists to prevent.
#   object-src 'none'       No plugins, ever.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

# Cheap, and honest about being marginal: this application asks for none of
# these, so denying them changes nothing today and means an injected script
# cannot start a camera tomorrow.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# ---------------------------------------------------------------------------
# Deliberately NOT set, and why
# ---------------------------------------------------------------------------
# X-XSS-Protection
#     Removed from Chrome, Edge and Safari; never implemented by Firefox.
#     While it existed its auditor was itself exploitable -- it could be
#     induced to blank out parts of a page and turn a non-issue into an
#     information leak. Setting it does nothing on a current browser and
#     setting it to "1; mode=block" on an old one is worse than nothing.
#
# X-Permitted-Cross-Domain-Policies
#     Addresses Flash and Acrobat cross-domain policy files. Neither exists
#     any more.
#
# Cross-Origin-Embedder-Policy / -Opener-Policy / -Resource-Policy
#     COOP/COEP exist to unlock SharedArrayBuffer and to isolate a document
#     from cross-origin openers. This app opens nothing, embeds nothing and
#     uses no SharedArrayBuffer. CORP would be worth setting if the report
#     JSON were fetched cross-origin, which it is not. Adding them here
#     would be three more lines nobody can explain, and an unexplained
#     header is one an operator will delete the first time something breaks.
