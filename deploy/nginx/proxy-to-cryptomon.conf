# Everything needed to proxy one location to the CryptoMon API.
#
# Included by each `location` in cryptomon.conf rather than written once at
# server level, because a `location` that needs `limit_req` or its own
# `add_header` still needs all of this, and nginx offers no way to say "as
# above, plus". Kept in one file so the three locations cannot drift: a
# proxy_set_header that exists in two of them and not the third is a bug
# that only shows on one route.
#
# Expects $cryptomon_prefix to be set in the enclosing server block.

# No URI part after the upstream name. That forwards the request line
# verbatim -- prefix included, undecoded, unnormalised -- which is what the
# app's ROOT_PATH arrangement requires and what its own input validation
# expects to see. See the long comment in cryptomon.conf.
proxy_pass http://cryptomon_api;

# 1.1 plus an empty Connection header is what makes the upstream keepalive
# pool work; without the second line nginx forwards the client's Connection
# header and the pooled connection is closed after a single request.
proxy_http_version 1.1;
proxy_set_header Connection "";

# --- what the application sees ---------------------------------------------
# The original Host, unchanged. This matters more than it looks: starlette
# builds `request.base_url` from the Host header in the ASGI scope, and
# `request.url_for` -- the post-upload redirect in fapi/app/uploads.py --
# is built from that. It does NOT consult X-Forwarded-Host. Rewrite Host
# here and the redirect after an upload points the browser at the upstream.
#
# $host is the Host header with any port removed (or the matched
# server_name). That is right for the ordinary case of 443, and wrong if you
# serve this on a non-standard port: the post-upload redirect then comes back
# as https://host/cryptomon/... with the port dropped, and the browser goes
# to the wrong place. Measured, not guessed -- it is what happens when this
# config is exercised on :18443. If you must run on another port, use
# $http_host here instead, and understand that it passes the client's Host
# header through verbatim rather than the one nginx matched.
proxy_set_header Host              $host;

proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# The other half of that URL. starlette takes the scheme from
# scope["scheme"], which uvicorn sets from this header and nothing else.
# Omit it and the redirect after an upload is http:// on an https site: the
# 308 in the plaintext server sends it back, so it appears to work, at the
# cost of a round trip in the clear carrying the new report's id.
proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Sent for completeness and for whatever sits behind this later. Be clear
# that uvicorn 0.30 ignores it: its proxy-header middleware handles
# X-Forwarded-For and X-Forwarded-Proto and has no notion of a prefix at all.
# The prefix reaches the application as ROOT_PATH in its environment file,
# not over the wire. Do not believe a guide that says otherwise without
# reading uvicorn/middleware/proxy_headers.py first.
proxy_set_header X-Forwarded-Prefix $cryptomon_prefix;

# None of the above has any effect unless uvicorn trusts this connection.
# It runs with --proxy-headers by default when started through
# `uvicorn.run`, which is what api.py does, and trusts 127.0.0.1 only. If
# nginx is not on the API host's loopback, set FORWARDED_ALLOW_IPS to its
# address in the environment file.
#
# There is no warning when this is wrong. Observed, with everything above
# set correctly and only FORWARDED_ALLOW_IPS naming an address the proxy
# does not connect from:
#
#   Location: http://cryptomon.example.org/cryptomon/analyse/reports/<id>
#             ^^^^ on an https site
#   uvicorn's log:  127.0.0.1 - "POST /cryptomon/analyse/" 303
#             ^^^^ every client appears to be the proxy
#
# The page still works, because the plaintext server block redirects it
# back -- at the cost of a round trip in the clear carrying a new report's
# id, and of an access log in which no client can be identified.

# --- timeouts --------------------------------------------------------------
proxy_connect_timeout 5s;

# Sending the request body upstream. With request buffering off this lasts
# as long as the client takes to upload.
proxy_send_timeout 300s;

# KEEP IN STEP: must exceed ANALYSIS_TIMEOUT_SECONDS (default 120).
#
# This is the gap nginx tolerates between reads from uvicorn, and the upload
# POST produces nothing at all until the analysis finishes. Set it below the
# analysis timeout and nginx answers 504 to a request the application
# completed: the report exists, the user is told it failed, and the retry
# costs another subprocess. 300s covers the upload plus a full-length
# analysis. tests/test_deployment.py fails if this drops to or below
# ANALYSIS_TIMEOUT_SECONDS.
proxy_read_timeout 300s;

# --- buffering -------------------------------------------------------------
# Request buffering OFF.
#
# With it on (nginx's default) nginx writes the whole upload to its own temp
# directory before it opens a connection upstream, and uvicorn then writes it
# again to UPLOAD_DIR: two complete copies on disk for one capture, and the
# application's mid-stream size check cannot fire until nginx has already
# accepted every byte. Streaming straight through means one copy, and means
# an oversized capture is refused by the application while it is still
# arriving rather than after it has all landed.
#
# What is given up: nginx can no longer retry the request against another
# upstream, and a slow client holds a uvicorn connection rather than an nginx
# one for the duration. There is a single upstream here, so the first costs
# nothing; the second is what limit_conn in cryptomon.conf is for.
proxy_request_buffering off;

# Response buffering stays ON. A response is a page of HTML or a JSON report;
# buffering frees the upstream worker as soon as it has finished instead of
# pacing it to the client's link.
proxy_buffering on;

# The application emits absolute URLs and, given the headers above, emits
# correct ones. Rewriting Location here would hide a missing
# X-Forwarded-Proto instead of exposing it -- and the links inside the HTML
# and the openapi document, which nginx cannot rewrite, would still be wrong.
# If a Location header comes back wrong, the fault is above, not here.
proxy_redirect off;
