# CryptoMon behind nginx: TLS termination and a subpath mount.
#
# This file is the boundary at which CryptoMon stops being a loopback tool.
# The API binds 127.0.0.1, refuses writes unless READ_ONLY=false, and can
# require an X-API-Key (fapi/config, fapi/app/security.py), so until now
# nothing it does is reachable by a stranger. Everything below changes that,
# which makes this a security artifact rather than a convenience, and is why
# so much of it is comment.
#
# Install:
#   /etc/nginx/conf.d/cryptomon.conf                <- this file
#   /etc/nginx/cryptomon/proxy-to-cryptomon.conf
#   /etc/nginx/cryptomon/security-headers.conf
#
# conf.d/ and Debian's sites-enabled/ are both included at `http` level,
# which this file needs: `map`, `upstream` and `limit_req_zone` are not valid
# inside a `server` block.
#
# ---------------------------------------------------------------------------
# WHAT AN OPERATOR MUST CHANGE. Nothing else here is site-specific.
# ---------------------------------------------------------------------------
#   1. server_name                  -- marked REPLACE, two places
#   2. ssl_certificate / _key       -- marked REPLACE
#   3. The upstream address, if the API is not on this host's loopback
#   4. The subpath, if it is not /cryptomon -- marked PREFIX. It must equal
#      ROOT_PATH in the service's environment file. Read the next section
#      before changing it.
#
# To serve at the domain root instead: set ROOT_PATH= (empty), change
# `location /cryptomon/` to `location /`, delete the `location = /cryptomon`
# redirect, delete the catch-all 444, adjust the two remaining PREFIX
# locations, and set $cryptomon_prefix to "".
#
# ---------------------------------------------------------------------------
# The subpath, and why nginx does NOT strip it
# ---------------------------------------------------------------------------
# Serving an app at https://host/cryptomon/ means the app has to know it is
# at /cryptomon/, because it generates absolute URLs. fapi/app/uploads.py
# redirects to `request.url_for('report', ...)` after an upload;
# fapi/app/templates/upload.html posts to action="" and so inherits whatever
# path the browser is on; FastAPI points /cryptomon/docs at an openapi.json
# whose URL it composes itself. Get the prefix wrong and the form posts one
# level up, or the redirect after a successful analysis 404s, or the docs
# page loads blank -- symptoms that look like application bugs rather than
# deployment ones.
#
# There is no header that tells the app. uvicorn 0.30's proxy-header
# middleware reads X-Forwarded-For and X-Forwarded-Proto and nothing else; it
# has no X-Forwarded-Prefix support whatsoever, so sending that header is
# inert (we send it anyway, for whatever sits in front of this later). The
# prefix is configuration, and it lives in ROOT_PATH.
#
# That leaves two ways to wire it up, and they are not equivalent:
#
#   (a) ROOT_PATH=/cryptomon, passed to FastAPI(root_path=...).
#       FastAPI sets scope["root_path"] and leaves scope["path"] alone.
#       starlette then removes the prefix from the path before routing, with
#       `re.sub(r"^" + root_path, "", scope["path"])` -- a substitution that
#       simply does nothing when the prefix is not there. So (a) works
#       whether nginx passes the URI unchanged or strips the prefix first.
#
#   (b) uvicorn --root-path=/cryptomon, with no FastAPI root_path.
#       uvicorn PREPENDS the value to the path it received
#       (uvicorn/protocols/http/h11_impl.py: `full_path = self.root_path +
#       path`). That only lands correctly if nginx has already removed the
#       prefix. Point (b) at an nginx that passes the URI unchanged and
#       uvicorn produces /cryptomon/cryptomon/analyse/, which 404s.
#
# This config is (a), and does not strip. Do not set both: FastAPI's
# root_path overwrites uvicorn's in the scope while uvicorn has already
# doubled the path, which is the same 404 by a longer route.
#
# (a) also chooses the better failure. What an operator gets when the nginx
# location and the configured prefix drift apart -- measured, not guessed:
#
#   (a) with ROOT_PATH forgotten, nginx passing the URI unchanged:
#         GET /cryptomon/analyse/  -> 404
#         GET /cryptomon/docs      -> 404
#       A 404 on the first page opened. Loud, immediate, one cause.
#
#   (b) with --root-path forgotten, nginx stripping:
#         GET /cryptomon/analyse/  -> 200, the form renders
#         POST                     -> 303, Location:
#                                     https://host/analyse/reports/<id>
#       Every page works. Only the GENERATED urls are wrong, one level up:
#       the redirect after a successful analysis 404s, and /cryptomon/docs
#       loads blank because the openapi.json it names is not there. That is
#       found by a user, days later, and it looks like an application bug
#       rather than a deployment one.
#
# A configuration that is wrong should break where it is wrong.
#
# One consequence of (a) worth knowing before it surprises somebody: because
# the strip is a no-op when the prefix is absent, an app configured with
# ROOT_PATH=/cryptomon still answers /analyse/ on its own socket. That is
# not an extra exposure -- uvicorn binds loopback and this config forwards
# only the prefixed location -- but it does mean the unprefixed path is not
# evidence that ROOT_PATH is unset.
#
# Passing the URI unchanged has a further benefit: `proxy_pass` with no URI
# part forwards the request line verbatim, while `proxy_pass` WITH a URI
# forwards nginx's decoded and normalised version of the path. Verbatim is
# the safer thing to hand an application that validates its own inputs --
# and fapi/app/uploads.py does exactly that with the report id.
# ---------------------------------------------------------------------------


# The API. One upstream, on loopback, because that is where the HOST default
# in fapi/config puts it.
upstream cryptomon_api {
    server 127.0.0.1:8000;            # REPLACE if the API is not local

    # Reuse connections to uvicorn instead of opening one per request.
    # Requires proxy_http_version 1.1 and an emptied Connection header, both
    # set in proxy-to-cryptomon.conf.
    keepalive 16;
}

# Rate limiting keyed on the client address, but only for the request that
# costs something.
#
# A GET of the upload form is a template render. A POST to the same path
# spawns a subprocess that may run for ANALYSIS_TIMEOUT_SECONDS and allocate
# up to 2 GiB (pcapscan/sandbox.py). Limiting both at the rate the expensive
# one deserves makes the form unusable; limiting neither lets one client
# occupy every worker.
#
# nginx cannot match on method in `limit_req`, so the KEY does the matching:
# a limit_req_zone whose key evaluates to the empty string does not count the
# request at all. GET passes through unlimited; POST is counted.
map $request_method $cryptomon_upload_key {
    default   "";
    POST      $binary_remote_addr;
}

# 6 uploads a minute, burst 2. An honest analysis session is one capture at a
# time with a human reading the result in between; six a minute is far above
# that and far below what it takes to keep a machine busy. 10m of shared
# memory holds on the order of 160,000 addresses.
limit_req_zone $cryptomon_upload_key zone=cryptomon_upload:10m rate=6r/m;

# Concurrency matters more than rate here, because the cost is a live
# subprocess rather than a completed one.
limit_conn_zone $binary_remote_addr zone=cryptomon_conn:10m;

# 429 rather than nginx's default 503. A limited client is being asked to
# slow down, not told the service is broken, and the difference decides
# whether a script backs off or retries immediately.
limit_req_status 429;
limit_conn_status 429;

# Keep report ids out of the access log.
#
# A report id is the only credential guarding a report, and a report holds
# the server names found in somebody's capture. Logging the URL verbatim
# copies that credential into a file with a different retention policy from
# the report itself: REPORT_RETENTION_HOURS sweeps the report after a day
# while logrotate keeps the access log for weeks, so the log outlives the
# thing it grants access to. Log the route, not the id.
map $request_uri $cryptomon_logged_uri {
    "~^(?<report_route>.*/reports/)[0-9a-f]{32}(?<report_tail>.*)$"
        "${report_route}REDACTED${report_tail}";
    default $request_uri;
}

# $request_time is the field worth having: it is how an operator discovers
# that analyses are creeping towards ANALYSIS_TIMEOUT_SECONDS before a user
# discovers it as a 504.
log_format cryptomon '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $cryptomon_logged_uri $server_protocol" '
                     '$status $body_bytes_sent $request_time '
                     'upstream=$upstream_status ut=$upstream_response_time';


# ---------------------------------------------------------------------------
# Plaintext: redirect only.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cryptomon.example.org;        # REPLACE

    # No proxying here at all. An upload form served over http sends a
    # capture -- browsing history -- across the wire in the clear, and a
    # redirect issued after the POST is a redirect issued after the file has
    # already gone.
    #
    # 308 rather than 301: 301 permits a client to turn a POST into a GET,
    # which would silently discard an upload instead of retrying it.
    location / {
        return 308 https://$host$request_uri;
    }
}


# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 and later. On an older nginx delete this line and write
    # `listen 443 ssl http2;` above instead.
    http2 on;

    server_name cryptomon.example.org;        # REPLACE

    ssl_certificate     /etc/ssl/certs/cryptomon.crt;      # REPLACE
    ssl_certificate_key /etc/ssl/private/cryptomon.key;    # REPLACE

    # The subpath in one place, for the X-Forwarded-Prefix header. nginx does
    # not accept a variable in a `location` path, so the literal still
    # appears on the location lines below -- they are marked PREFIX.
    set $cryptomon_prefix /cryptomon;         # PREFIX

    # TLS 1.2 is the floor. 1.0 and 1.1 have no cipher suite worth offering
    # and are refused by every browser that could reach this page.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Applies to TLS 1.2 only; TLS 1.3 suites come from OpenSSL's own list
    # and are all AEAD already. Forward secrecy and AEAD, with no CBC, no RSA
    # key transport and no SHA-1. A tool that exists to report on other
    # people's cryptography should not be embarrassing about its own.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Let the client choose. Every option in that list is acceptable, and the
    # client is the side that knows whether it has AES hardware -- which is
    # the only thing left to decide between AES-GCM and ChaCha20.
    ssl_prefer_server_ciphers off;

    # X25519 first. On OpenSSL 3.5 or newer, or a 3.2+ build with the oqs
    # provider, a hybrid group can go in front of it:
    #
    #     ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
    #
    # Left out of the live line because naming a group the linked OpenSSL
    # does not know makes nginx fail to START, and an operator who is unsure
    # which OpenSSL they have should not find out during a restart. This
    # project's own dashboard will tell you whether clients offer it.
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    ssl_session_cache shared:CryptoMonTLS:10m;
    ssl_session_timeout 1d;
    # Session tickets defeat forward secrecy unless the ticket key rotates,
    # and nginx does not rotate it: one key is generated at start and used
    # until restart, so recovering it recovers every session since. The
    # session cache above gives resumption without that trade.
    ssl_session_tickets off;

    # OCSP stapling is worth having and is deliberately not enabled: it needs
    # a `resolver` this host can actually use, and a wrong one costs a DNS
    # timeout on the first handshake after every restart.
    #
    #   ssl_stapling on;
    #   ssl_stapling_verify on;
    #   ssl_trusted_certificate /etc/ssl/certs/cryptomon-chain.crt;
    #   resolver 127.0.0.53 valid=300s;

    # "nginx" rather than "nginx/1.27.3". nginx already replaces the
    # upstream's own Server and Date headers by default, so uvicorn's version
    # is not disclosed either.
    server_tokens off;

    access_log /var/log/nginx/cryptomon.access.log cryptomon;
    error_log  /var/log/nginx/cryptomon.error.log warn;

    # -----------------------------------------------------------------------
    # Body size
    # -----------------------------------------------------------------------
    # The default here is small on purpose. /data/ accepts a JSON document
    # and hands it to pydantic; there is no reason for that route ever to see
    # a quarter of a gigabyte, and inheriting the upload limit everywhere
    # would let one POST to /data/ buy 256 MiB of parsing. The large limit
    # belongs only on the route that has a reason for it.
    client_max_body_size 1m;

    # Between two successive reads of the request body, not a total. A
    # 256 MiB upload on a slow link is fine; two minutes of silence is not.
    client_body_timeout 120s;
    client_header_timeout 15s;
    send_timeout 120s;

    # A request to /cryptomon (no trailing slash) does not match
    # `location /cryptomon/`, so without this it falls through to the 444.
    location = /cryptomon {                   # PREFIX
        return 308 /cryptomon/;               # PREFIX
    }

    # -----------------------------------------------------------------------
    # The application: one location for every route it serves.
    # -----------------------------------------------------------------------
    # The upload form, the report pages, /data/, /docs, /openapi.json, and
    # the dashboard routes that do not exist yet. Enumerating paths here
    # would mean editing this file every time a route is added, and the first
    # symptom of forgetting is a 404 on a page that works locally.
    location /cryptomon/ {                    # PREFIX -- must equal ROOT_PATH
        limit_conn cryptomon_conn 8;
        include /etc/nginx/cryptomon/proxy-to-cryptomon.conf;
        include /etc/nginx/cryptomon/security-headers.conf;
    }

    # -----------------------------------------------------------------------
    # The upload POST: the only request that costs a subprocess.
    # -----------------------------------------------------------------------
    # An exact-match location, so it wins over `location /cryptomon/` for
    # this one path and for nothing else.
    location = /cryptomon/analyse/ {          # PREFIX
        limit_req  zone=cryptomon_upload burst=2 nodelay;
        limit_conn cryptomon_conn 4;

        # KEEP IN STEP: strictly greater than MAX_UPLOAD_BYTES (default
        # 256 MiB = 268435456).
        #
        # fapi/app/uploads.py enforces MAX_UPLOAD_BYTES while reading the
        # stream, then answers 413 with a message naming the limit and
        # suggesting `editcap -c`. That message only reaches a user if the
        # request gets as far as the application. If this number is smaller,
        # nginx refuses first with its own unstyled HTML 413 and the careful
        # mid-stream check never runs.
        #
        # Strictly greater, not equal: nginx measures the whole request body
        # -- multipart boundaries, part headers, the `as_json` field -- while
        # the application measures only the file. At exactly 256 MiB of
        # capture the two disagree by a few hundred bytes, in the direction
        # that gives the user the wrong error page. 1 MiB of headroom makes
        # the application the one that answers at the boundary.
        #
        # Raise one, raise the other. tests/test_deployment.py fails if they
        # drift.
        client_max_body_size 257m;

        include /etc/nginx/cryptomon/proxy-to-cryptomon.conf;

        # A report is somebody's browsing history. A shared cache holding
        # one, or a browser cache leaving one on a shared machine, is the
        # same disclosure the retention sweep exists to prevent. `no-store`
        # rather than `no-cache`, which permits storage and merely requires
        # revalidation.
        #
        # This add_header is why security-headers.conf is included again: a
        # location that adds any header of its own silently drops every
        # header inherited from the server block. See that file's header.
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/cryptomon/security-headers.conf;
    }

    # Report pages, for the same caching reason. A regex location, so it is
    # matched ahead of the `/cryptomon/` prefix location.
    location ~ ^/cryptomon/analyse/reports/ {   # PREFIX
        limit_conn cryptomon_conn 8;
        include /etc/nginx/cryptomon/proxy-to-cryptomon.conf;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/cryptomon/security-headers.conf;
    }

    # Anything outside the prefix is not this application. 444 closes the
    # connection with no response at all: a scanner walking the domain learns
    # nothing about what is here, and no error page is rendered for a request
    # that was never going anywhere.
    location / {
        return 444;
    }
}
